name: Generate Tomato Snake

on:
  schedule:
    - cron: "17 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tomato-snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate light and dark snakes
        uses: Platane/snk@v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#E94B35&color_dots=#F6F1EC,#FFD2C6,#FF9A82,#E94B35,#A9281C
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#FFC857&color_dots=#161B22,#5B2018,#A93424,#E94B35,#FF8A3D

      - name: Publish generated assets
        uses: crazy-max/ghaction-github-pages@v5.0.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

