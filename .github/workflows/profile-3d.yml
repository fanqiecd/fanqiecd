name: Generate Tomato 3D Contributions

on:
  schedule:
    - cron: "37 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tomato-profile-3d
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the profile repository
        uses: actions/checkout@v5

      - name: Generate the 3D contribution graph
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: profile-3d-contrib/settings.json

      - name: Commit generated graph
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add profile-3d-contrib/profile-tomato-workshop.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: update 3D contribution graph"
          git push

